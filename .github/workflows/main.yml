name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.5'

      - name: Fill in missing Android scaffolding
        run: flutter create . --platforms android

      - name: Ensure voice permissions in AndroidManifest
        run: |
          f=android/app/src/main/AndroidManifest.xml
          for p in INTERNET RECORD_AUDIO MODIFY_AUDIO_SETTINGS; do
            if ! grep -q "android.permission.$p" "$f"; then
              sed -i "0,/<manifest[^>]*>/s//&\n    <uses-permission android:name=\"android.permission.$p\" \/>/" "$f"
            fi
          done
          grep -q "android.permission.RECORD_AUDIO" "$f"

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sultan-voice-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
